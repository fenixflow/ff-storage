# Fenix Packages CI/CD
# Main branch only. 400 min/month budget — keep it lean.
# Unit tests only (no integration tests that need databases).

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - ff-logger/**
        - ff-storage/**
        - ff-cli/**
        - ff-parsers/**
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - test
  - publish

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

default:
  image: python:3.12-slim
  before_script:
    - pip install --quiet uv twine
    - uv --version

# ── Test + Build ────────────────────────────────────────────────────

.test_and_build: &test_and_build
  stage: test
  script:
    - cd ${PACKAGE}
    - uv pip install --system -e ".[dev]" 2>/dev/null || uv pip install --system -e "."
    - python -m pytest tests/unit/ -x --tb=short -q 2>/dev/null || echo "No unit tests"
    - rm -rf dist/ && uv build
  artifacts:
    paths:
      - ${PACKAGE}/dist/
    expire_in: 1 hour

test:ff-storage:
  <<: *test_and_build
  variables:
    PACKAGE: ff-storage
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ff-storage/**]
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

test:ff-logger:
  <<: *test_and_build
  variables:
    PACKAGE: ff-logger
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ff-logger/**]
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

test:ff-cli:
  <<: *test_and_build
  variables:
    PACKAGE: ff-cli
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ff-cli/**]
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

test:ff-parsers:
  <<: *test_and_build
  variables:
    PACKAGE: ff-parsers
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ff-parsers/**]
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

# ── GitLab Package Registry (automatic after test) ──────────────────

.publish_gitlab: &publish_gitlab
  stage: publish
  script:
    - cd ${PACKAGE}
    - |
      VERSION=$(python3 -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')
      echo "Publishing ${PACKAGE} v${VERSION}"

      WHEEL=$(find dist -name "*.whl" -print -quit)
      WHEEL_NAME=$(basename "${WHEEL}")
      PKG_NORM=$(python3 -c 'import re,sys; print(re.sub(r"[-_.]+","-",sys.argv[1]).lower())' "${PACKAGE}")
      URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi/files/${PKG_NORM}/${VERSION}/${WHEEL_NAME}"

      if curl -s -o /dev/null -w "%{http_code}" --head --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${URL}" | grep -qE "^(200|302)$"; then
        echo "Already published — skipping"
        exit 0
      fi

      printf '[distutils]\nindex-servers = gitlab\n[gitlab]\nrepository = %s/projects/%s/packages/pypi\nusername = gitlab-ci-token\npassword = %s\n' \
        "${CI_API_V4_URL}" "${CI_PROJECT_ID}" "${CI_JOB_TOKEN}" > ~/.pypirc
      twine upload --repository gitlab dist/* --verbose

publish:gitlab:ff-storage:
  <<: *publish_gitlab
  variables:
    PACKAGE: ff-storage
  needs: [test:ff-storage]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ff-storage/pyproject.toml]
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

publish:gitlab:ff-logger:
  <<: *publish_gitlab
  variables:
    PACKAGE: ff-logger
  needs: [test:ff-logger]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ff-logger/pyproject.toml]
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

publish:gitlab:ff-cli:
  <<: *publish_gitlab
  variables:
    PACKAGE: ff-cli
  needs: [test:ff-cli]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ff-cli/pyproject.toml]
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

publish:gitlab:ff-parsers:
  <<: *publish_gitlab
  variables:
    PACKAGE: ff-parsers
  needs: [test:ff-parsers]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ff-parsers/pyproject.toml]
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

# ── PyPI (manual, ff-storage and ff-logger only) ────────────────────

.publish_pypi: &publish_pypi
  stage: publish
  script:
    - cd ${PACKAGE}
    - |
      VERSION=$(python3 -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')
      echo "Publishing ${PACKAGE} v${VERSION} to PyPI"
      twine upload --non-interactive --username __token__ --password "${PYPI_TOKEN}" dist/*

publish:pypi:ff-storage:
  <<: *publish_pypi
  variables:
    PACKAGE: ff-storage
  needs:
    - job: publish:gitlab:ff-storage
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ff-storage/pyproject.toml]
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never

publish:pypi:ff-logger:
  <<: *publish_pypi
  variables:
    PACKAGE: ff-logger
  needs:
    - job: publish:gitlab:ff-logger
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [ff-logger/pyproject.toml]
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never
