name: chat
build:
  context: "${FENIX_WORKSPACE:-~/PycharmProjects/fenixflow}/fenix-chat"
  dockerfile: docker/backend/Dockerfile.prod
ports:
  - "8011:8011"
environment:
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8011"
  DATABASE_URL: "postgresql://${FENIX_DB_USER:-fenix}:${FENIX_DB_PASSWORD:-fenix_dev}@postgres.${FENIX_DOMAIN:-fenix.orb.local}:5432/fenixchat"
  OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
depends_on:
  - postgres
healthcheck:
  test: ["CMD", "curl", "-sf", "http://localhost:8011/health"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s
restart: unless-stopped
